[project]
name = "fold"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Mauricio Cafiero", email = "cafierom@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "gemmi>=0.7.5",
    "modal>=1.5.3",
    "rdkit>=2026.3.5",
    "requests>=2.34.2",
    "torch>=2.13.0",
    "transformers>=5.14.1",
    "typer>=0.27.1",
]

[project.optional-dependencies]
docking = [
    "scipy>=1.14",
    "scikit-learn>=1.5",
    "dockstring>=0.3.3",
    "openbabel-wheel>=3.1.1",
]

[project.scripts]
fold = "fold:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
